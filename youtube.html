<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVILJAY THEATER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#1a0508,#050505 60%);color:#fff;font-family:system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
.curtain{position:fixed;top:0;bottom:0;z-index:99;pointer-events:none;background:repeating-linear-gradient(90deg,#8a0b14 0,#e21b2a 14px,#8a0b14 28px);box-shadow:0 0 30px #000}
.curtain.left{left:0;width:50%;animation:open 3.5s ease-in-out .6s forwards}
.curtain.right{right:0;width:50%;animation:open 3.5s ease-in-out .6s forwards}
@keyframes open{to{width:7%}}
.hero{text-align:center;padding:40px 10px 8px}
.hero h1{font-size:clamp(26px,7vw,48px);font-weight:900;animation:glow 2.5s ease-in-out infinite}
.hero h1 span{color:#e21b2a}
@keyframes glow{50%{text-shadow:0 0 18px #e21b2a}}
.hero p{color:#777;font-size:9px;letter-spacing:3px;margin-top:8px}
.now{display:inline-block;margin-top:12px;background:#c1121f;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 16px #e21b2a}}
.wrap{max-width:94%;margin:14px auto}
.screen{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:2px solid #2a2a2a;box-shadow:0 0 25px rgba(226,27,42,.25)}
.screen iframe{width:100%;height:100%;border:0}
.theater{background:#0f0f0f;border:1px solid #1d1d1d;border-radius:14px;overflow:hidden;margin-bottom:24px}
.top{padding:8px;text-align:center;background:linear-gradient(180deg,#e21b2a,#7a0a0a);font-size:10px;font-weight:900;letter-spacing:2px}
.info{display:flex;justify-content:space-between;padding:8px 12px;font-size:12px;background:#0a0a0a}
.seats{text-align:center;padding:8px;background:#050505;border-top:1px solid #111;font-size:20px}
.seats span{display:inline-block;animation:bob 2s ease-in-out infinite}
.seats span:nth-child(2){animation-delay:.2s}.seats span:nth-child(3){animation-delay:.4s}
.seats span:nth-child(4){animation-delay:.6s}.seats span:nth-child(5){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-4px)}}
.pop{position:fixed;bottom:-40px;font-size:22px;z-index:5;opacity:.7;animation:rise 9s linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg)}}
.foot{text-align:center;padding:10px 10px 40px}
.foot a{background:#c1121f;color:#fff;padding:12px 22px;border-radius:24px;text-decoration:none;font-weight:900;font-size:13px}
</style></head><body>
<div class="curtain left"></div><div class="curtain right"></div>
<div class="pop" style="left:15%">🍿</div>
<div class="pop" style="left:50%;animation-delay:3s">🎬</div>
<div class="pop" style="left:80%;animation-delay:6s">🍿</div>

<div class="hero">
<h1>🎬 EVILJAY <span>THEATER</span> 🎬</h1>
<p>YOUTUBE.COM/@EVILJAYYY • DAILY AUTO-PLAY • FRONT ROW</p>
<div class="now">🔥 NOW SHOWING: NEWEST UPLOAD</div>
</div>

<div class="wrap"><div class="screen">
<iframe src="https://www.youtube.com/embed/videoseries?list=UUb93fPn7yL9V68jntdSG_ZQ&autoplay=1&mute=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div></div>

<div class="wrap" id="theaters"></div>

<div class="foot"><a href="https://www.youtube.com/@eviljayyy" target="_blank">🎟️ SUBSCRIBE ON YOUTUBE</a></div>

<script>
var L='UUb93fPn7yL9V68jntdSG_ZQ',h='';
for(var i=0;i<4;i++){
 h+='<div class="theater"><div class="top">🎞️ THEATER '+(i+1)+(i==0?' • FRONT ROW • NEWEST':'')+'</div>'
 +'<div class="screen"><iframe src="https://www.youtube.com/embed/videoseries?list='+L+'&index='+i+'&rel=0" loading="lazy" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div>'
 +'<div class="info"><span>Daily Drop #'+(i+1)+'</span><span>@eviljayyy</span></div>'
 +'<div class="seats"><span>💺</span><span>💺</span><span>💺</span><span>💺</span><span>💺</span></div></div>';
}
document.getElementById('theaters').innerHTML=h;
</script>
</body></html>
