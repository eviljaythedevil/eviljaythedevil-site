.seats span:nth-child(2){animation-delay:.2s}.seats span:nth-child(3){animation-delay:.4s}

<script>
function frame(id,auto){
  return '<iframe src="https://www.youtube.com/embed/'+id+'?rel=0&playsinline=1'+(auto?'&autoplay=1&mute=1':'')+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="'+(auto?'eager':'lazy')+'"></iframe>';
}
fetch('/api/videos').then(function(r){return r.json()}).then(function(d){
  var ids=d.ids||[];
  if(!ids.length) throw 1;
  var day=Math.floor(Date.now()/86400000);
  var f=ids[day%ids.length];
  document.getElementById('featured').innerHTML=frame(f,true);
  var rest=ids.filter(function(x){return x!==f}).slice(0,4);
  var h='';
  for(var i=0;i<rest.length;i++){

    +'<div class="info"><span>Drop #'+(i+1)+'</span><span>@eviljayyy</span></div>'
    +'<div class="seats"><span>💺</span><span>💺</span><span>💺</span><span>💺</span><span>💺</span></div></div>';
  }
  document.getElementById('theaters').innerHTML=h;
}).catch(function(){
  document.getElementById('featured').innerHTML='<iframe src="https://www.youtube.com/embed/videoseries?list=UUb93fPn7yL9V68jntdSG_ZQ" allowfullscreen></iframe>';
});
